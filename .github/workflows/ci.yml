# CI for the AOC repository itself.
#
# The required status check named in docs/compliance/self-modification-boundary.md (layer 3) is
# scripts/check.sh: typecheck, tests per package, the compliance-docs check, then the packaging smoke test. Make
# the job below ("check") a required status check on the main-branch ruleset, with no bypass actors.
#
# .github/ is a Tier 1 path: a change to this file needs a code owner other than its author. Actions are pinned to
# commit SHAs (a mutable tag is a supply-chain path into every build); the comment names the release each SHA is.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/check-docs.mjs reads every commit subject to find gaps closed in code but still listed open.
          fetch-depth: 0
          # Nothing here pushes; keep the token out of the git config that the tests' git children can read.
          persist-credentials: false
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The oldest Node AOC runs on (package.json engines): CI proves the minimum, not just a recent release.
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check.sh
